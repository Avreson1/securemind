name: Build Multi-Platform Packages (Desktop & Mobile)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. DESKTOP BUILDS (Windows .exe, Linux .AppImage, macOS .dmg)
  # ==========================================
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact_name: windows-binaries
          - os: ubuntu-latest
            target: --linux
            artifact_name: linux-binaries
          - os: macos-latest
            target: --mac
            artifact_name: macos-binaries

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web Frontend Assets
        run: |
          cd frontend
          npm run build

      - name: Package Desktop Executable via Electron Builder
        run: |
          cd frontend
          npx electron-builder ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            frontend/release/*.exe
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/*.dmg
            frontend/release/*.zip
          if-no-files-found: warn

  # ==========================================
  # 2. ANDROID MOBILE BUILD (.apk)
  # ==========================================
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          cd frontend
          npm run build
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          cd frontend/android
          chmod +x gradlew

      - name: Assemble Android APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk

  # ==========================================
  # 3. iOS MOBILE BUILD (.ipa workspace)
  # ==========================================
  build-ios:
    name: Build iOS Project Structure
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web Assets & Sync Capacitor iOS
        run: |
          cd frontend
          npm run build
          npx cap sync ios

      - name: Build Xcode Workspace (No Codesign / Simulator Archive)
        run: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -destination 'generic/platform=iOS Simulator' clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Workspace Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-workspace
          path: frontend/ios/
