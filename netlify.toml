[build]
  command = "if [ -d \"frontend\" ]; then cd frontend && npm install && npm run build && cd .. && cp -r frontend/dist ./dist; else npm install && npm run build; fi"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
